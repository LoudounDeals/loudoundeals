name: Security checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=24.22.1 <25'
          check-latest: true
          package-manager-cache: false
      - run: npm test
      - run: npm run build
      - name: Record artifact checksums
        run: sha256sum data/deals.json dist/index.html > artifact-checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-roundtrip
          path: |
            data/deals.json
            dist/
            artifact-checksums.txt
          retention-days: 1
          if-no-files-found: error
  artifact-roundtrip:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-roundtrip
      - name: Verify downloaded paths and contents
        run: sha256sum --check artifact-checksums.txt
