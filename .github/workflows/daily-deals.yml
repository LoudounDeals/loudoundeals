name: Daily deal discovery
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-deals
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check sources and discover candidates
        run: npm run update
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      - run: npm test
      - run: npm run build
      - name: Save approved data updates
        run: |
          git config user.name "LoudounDeals updater"
          git config user.email "updates@users.noreply.github.com"
          git add data dist
          if ! git diff --cached --quiet; then
            git commit -m "Refresh restaurant source checks"
            git push
          fi
      - name: Keep review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-review-report
          path: reports/latest.json
          retention-days: 30
